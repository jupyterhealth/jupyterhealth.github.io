<section class="section brands py-5">
  <div class="container">
    {{ with .content.title }}
      <p class="brands-kicker font-monospace text-uppercase text-center">{{ . }}</p>
    {{ end }}
    <div class="brands-logos d-flex flex-wrap justify-content-center align-items-center">
      {{ range .content.items }}
        <img
          src="{{ .src | relURL }}"
          alt="{{ .alt }}"
          class="brand-logo"
          style="height: {{ .height }}px;"
        />
      {{ end }}
    </div>
  </div>
</section>
