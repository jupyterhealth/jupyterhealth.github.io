# Shared navbar, footer, and plugins for all JupyterHealth docs sites.
# Other sites include this with:
#   extends:
#     - https://raw.githubusercontent.com/jupyterhealth/jupyterhealth-docs/main/docs/_site/site.yml
# All links are absolute URLs so they resolve from any site.
version: 1
project:
  plugins:
    - https://github.com/jupyter-book/myst-plugins/releases/download/footer-latest/index.mjs
    - https://github.com/myst-contrib/myst-iconify/releases/latest/download/index.mjs
    - https://github.com/myst-contrib/myst-listing/releases/latest/download/plugin.mjs
    - https://github.com/myst-contrib/myst-gui-text/releases/latest/download/index.mjs
site:
  template: book-theme
  options:
    logo: https://raw.githubusercontent.com/jupyterhealth/jupyterhealth-docs/main/docs/_site/logo.png
    logo_dark: https://raw.githubusercontent.com/jupyterhealth/jupyterhealth-docs/main/docs/_site/logo-dark.png
    logo_url: https://docs.jupyterhealth.org/
    logo_text: Docs
  nav:
    - title: Docs
      url: https://docs.jupyterhealth.org/
    - title: Exchange
      url: https://docs.jupyterhealth.org/software-documentation/
    - title: Client library
      url: https://jupyterhealth-client.readthedocs.io
    - title: Hub
      url: https://docs.jupyterhealth.org/hub/
    - title: Demos
      url: https://docs.jupyterhealth.org/demos/
  parts:
    # Raw GitHub URLs so the parts resolve for sites that extend this file.
    navbar_end: https://raw.githubusercontent.com/jupyterhealth/jupyterhealth-docs/main/docs/_site/navbar_end.md
    footer: https://raw.githubusercontent.com/jupyterhealth/jupyterhealth-docs/main/docs/_site/footer.md
