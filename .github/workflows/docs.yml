# Build the docs with nox on every PR, and deploy to GitHub Pages from main.
name: docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Build the docs on all builds so we can test that they build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx nox -s docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # If we're on main, also deploy live
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
